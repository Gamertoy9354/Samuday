# Render Blueprint Specification for Samuday E-Commerce Platform
# Learn more: https://render.com/docs/blueprint-spec

services:
  # -------------------------------------------------------------
  # 1. FastAPI Backend Web Service
  # -------------------------------------------------------------
  - type: web
    name: samuday-backend
    runtime: python
    rootDir: samuday-backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /docs
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SYNC_DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: PII_ENCRYPTION_KEY
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false

  # -------------------------------------------------------------
  # 2. React Vite Frontend Static Site
  # -------------------------------------------------------------
  - type: static
    name: samuday-frontend
    rootDir: samuday-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    domains:
      - samuday.rngpitai.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_API_URL
        fromService:
          type: web
          name: samuday-backend
          property: url
